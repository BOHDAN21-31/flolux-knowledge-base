[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install"]

[phases.build]
# Білдимо фронтенд і копіюємо його в apps/api/public,
# та генеруємо Prisma-клієнт для бекенду.
cmds = [
  "npm run prisma:generate --workspace apps/api",
  "npm run build"
]

[start]
# Старт лише API: він робить prisma migrate deploy, seed і віддає SPA на $PORT.
cmd = "npm run start"
